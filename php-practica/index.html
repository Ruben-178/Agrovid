<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrovid - Contacto (práctica PHP)</title>
</head>
<body>

    <h1>Contacto - Agrovid</h1>
    <p>Práctica de formulario con envío al servidor mediante PHP.</p>

    <form action="procesar.php" method="POST">
        <div>
            <label for="nombre">Nombre</label><br>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo" required>
        </div>

        <div>
            <label for="email">Correo electrónico</label><br>
            <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
        </div>

        <div>
            <label for="mensaje">Mensaje</label><br>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Cuéntanos qué necesitas..." required></textarea>
        </div>

        <button type="submit">Enviar mensaje</button>
    </form>

</body>
</html>
